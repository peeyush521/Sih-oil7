server.port=8081

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/sif_precursor

# JWT Configuration
jwt.secret=SIF-precursor-intelligence-secret-key-change-in-production-at-least-32-chars
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# FastAPI Backend Proxy Target
proxy.target=http://127.0.0.1:8000

# Logging
logging.level.com.sif.precursor=DEBUG
logging.level.org.springframework.security=DEBUG
